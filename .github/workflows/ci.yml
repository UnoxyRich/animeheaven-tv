name: Android TV CI & UI Tests

on:
  push:
    branches: [ main, netflix-ui, "fix/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish TV APK to GitHub Releases"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-release:
    name: Unit Tests & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses & install SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run JVM tests, lint, compile UI tests & build release + sideload APKs
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            ASSET_SUFFIX="${GITHUB_REF_NAME}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
            ASSET_SUFFIX="latest"
          fi
          VERSION_CODE="${GITHUB_RUN_NUMBER}"

          SIGNING_ARGS=()
          KEYSTORE_PATH=""
          if [[ -n "${KEYSTORE_B64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
            SIGNING_ARGS+=(
              "-PKEYSTORE_FILE=${KEYSTORE_PATH}"
              "-PKEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
              "-PKEY_ALIAS=${KEY_ALIAS}"
              "-PKEY_PASSWORD=${KEY_PASSWORD}"
            )
          fi

          cleanup() {
            if [[ -n "$KEYSTORE_PATH" && -f "$KEYSTORE_PATH" ]]; then
              rm -f "$KEYSTORE_PATH"
            fi
          }
          trap cleanup EXIT

          ./gradlew testDebugUnitTest lintDebug compileDebugAndroidTestKotlin \
            assembleRelease assembleSideload \
            "-PversionCode=${VERSION_CODE}" \
            "-PversionName=${VERSION_NAME}" \
            ${SIGNING_ARGS[@]+"${SIGNING_ARGS[@]}"} \
            -PcomposeCompilerReports=true

          mkdir -p build/release-apks
          RELEASE_APK=""
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          elif [[ -f app/build/outputs/apk/release/app-release-unsigned.apk ]]; then
            RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          if [[ -n "$RELEASE_APK" ]]; then
            if [[ -n "$KEYSTORE_PATH" ]]; then
              cp "$RELEASE_APK" "build/release-apks/AnimeHeaven-TV-${ASSET_SUFFIX}.apk"
            else
              cp "$RELEASE_APK" "build/release-apks/AnimeHeaven-TV-unsigned-${ASSET_SUFFIX}.apk"
            fi
          fi
          if [[ -f app/build/outputs/apk/sideload/app-sideload.apk ]]; then
            cp app/build/outputs/apk/sideload/app-sideload.apk "build/release-apks/AnimeHeaven-TV-sideload-${ASSET_SUFFIX}.apk"
          fi
          ls -lh build/release-apks/

      - name: Upload Release APK & Compose reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animeheaven-tv-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/sideload/*.apk
            app/build/compose_compiler/

      - name: Upload staged release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apks
          path: build/release-apks/*.apk
          if-no-files-found: error

  publish-release:
    name: Publish TV APK to GitHub Releases
    runs-on: ubuntu-latest
    needs: unit-tests-and-release
    if: >
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.ref == 'refs/heads/main' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))
    permissions:
      contents: write
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-apks
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh release-assets/
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="AnimeHeaven TV ${TAG}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" release-assets/* --clobber
              gh release edit "$TAG" --title "$TITLE"
            else
              gh release create "$TAG" release-assets/* \
                --title "$TITLE" \
                --target "${GITHUB_SHA}" \
                --generate-notes
            fi
          else
            TAG="latest"
            TITLE="Latest TV Build (${SHORT_SHA})"
            NOTES="Automated Android TV APK build from \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`). Use \`AnimeHeaven-TV-sideload-latest.apk\` for direct installation if no release keystore is configured."
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
                -f "sha=${GITHUB_SHA}" -F force=true >/dev/null
              gh release upload "$TAG" release-assets/* --clobber
              gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
            else
              gh release create "$TAG" release-assets/* \
                --title "$TITLE" \
                --notes "$NOTES" \
                --target "${GITHUB_SHA}" \
                --prerelease
            fi
          fi

  android-tv-ui-tests:
    name: Real Android TV Emulator UI Tests & Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests-and-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses & install SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build walkthrough APKs before booting the emulator
        run: |
          ./gradlew --no-parallel --max-workers=2 assembleDebug assembleDebugAndroidTest
          ./gradlew --stop
          jps -l | awk '/KotlinCompileDaemon/ { print $1 }' | xargs -r kill

      - name: Cache the AVD configuration (not app data or snapshots)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.android/avd/animeheaven-tv.ini
            ~/.android/avd/animeheaven-tv.avd/config.ini
          key: android-avd-tv-v1-${{ runner.os }}-36-x86_64

      - name: Boot Android TV Emulator (API 36, tv_1080p) & capture walkthrough screenshots
        timeout-minutes: 14
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          emulator-boot-timeout: 360
          target: android-tv
          arch: x86_64
          avd-name: animeheaven-tv
          force-avd-creation: false
          profile: tv_1080p
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-ui-walkthrough.sh me.animeheaven.tv

      - name: Upload TV App Screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animeheaven-tv-screenshots
          path: screenshots/*.png

      - name: Upload UI Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animeheaven-tv-ui-tests
          path: ui-test-results/
