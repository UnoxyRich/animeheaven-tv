name: Android TV CI & UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-tests-and-release:
    name: Unit Tests & Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses & install SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests, compile Android UI tests & build R8 release APK
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleRelease -PcomposeCompilerReports=true

      - name: Upload Release APK & Compose reports
        uses: actions/upload-artifact@v4
        with:
          name: animeheaven-tv-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/compose_compiler/

  android-tv-ui-tests:
    name: Real Android TV Emulator UI Tests & Screenshots
    runs-on: ubuntu-latest
    needs: unit-tests-and-release
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses & install SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Boot Android TV Emulator (API 34, tv_1080p) & capture walkthrough screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell rm -rf /data/local/tmp/ci-screenshots
            adb shell mkdir -p /data/local/tmp/ci-screenshots
            ./gradlew connectedDebugAndroidTest --stacktrace
            mkdir -p screenshots
            adb pull /data/local/tmp/ci-screenshots/. screenshots/
            ls -lh screenshots/
            test "$(ls -1 screenshots/*.png | wc -l)" -ge 8

      - name: Upload TV App Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animeheaven-tv-screenshots
          path: screenshots/*.png

      - name: Upload UI Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animeheaven-tv-ui-tests
          path: app/build/reports/androidTests/connected/
