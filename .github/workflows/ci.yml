name: Android TV CI & UI Tests

on:
  push:
    branches: [ main, netflix-ui, "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-release:
    name: Unit Tests & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses & install SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run JVM tests and lint, compile Android UI tests & build R8 release APK
        run: ./gradlew testDebugUnitTest lintDebug compileDebugAndroidTestKotlin assembleRelease -PcomposeCompilerReports=true

      - name: Upload Release APK & Compose reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animeheaven-tv-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/compose_compiler/

  android-tv-ui-tests:
    name: Real Android TV Emulator UI Tests & Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests-and-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses & install SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build walkthrough APKs before booting the emulator
        run: |
          ./gradlew --no-parallel --max-workers=2 assembleDebug assembleDebugAndroidTest
          ./gradlew --stop
          jps -l | awk '/KotlinCompileDaemon/ { print $1 }' | xargs -r kill

      - name: Cache the AVD configuration (not app data or snapshots)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.android/avd/animeheaven-tv.ini
            ~/.android/avd/animeheaven-tv.avd/config.ini
          key: android-avd-tv-v1-${{ runner.os }}-36-x86_64

      - name: Boot Android TV Emulator (API 36, tv_1080p) & capture walkthrough screenshots
        timeout-minutes: 14
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          emulator-boot-timeout: 360
          target: android-tv
          arch: x86_64
          avd-name: animeheaven-tv
          force-avd-creation: false
          profile: tv_1080p
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-ui-walkthrough.sh me.animeheaven.tv

      - name: Upload TV App Screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animeheaven-tv-screenshots
          path: screenshots/*.png

      - name: Upload UI Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animeheaven-tv-ui-tests
          path: ui-test-results/
